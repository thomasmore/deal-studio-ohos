[package]
name = "local-jev"
version = "0.1.0"
edition = "2021"
default-run = "local-jev"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
candle-core = "=0.9.2"
candle-nn = "=0.9.2"
candle-transformers = "=0.9.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }

[profile.release]
lto = true
codegen-units = 1
